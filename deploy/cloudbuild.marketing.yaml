# Cloud Build: DeckVoice marketing site

substitutions:
  _REGION: us-central1
  _RUN_REGION: us-central1
  _SERVICE: deckvoice-marketing
  _AR_REPOSITORY: overtone
  _IMAGE_NAME: deckvoice-marketing
  _VITE_DASHBOARD_URL: https://deckvoice-v2-dashboard-4idrhaffca-uc.a.run.app
  _VITE_POSTHOG_KEY: ""
  _VITE_POSTHOG_HOST: https://us.i.posthog.com

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:$BUILD_ID
      - --build-arg
      - VITE_DASHBOARD_URL=${_VITE_DASHBOARD_URL}
      - --build-arg
      - VITE_POSTHOG_KEY=${_VITE_POSTHOG_KEY}
      - --build-arg
      - VITE_POSTHOG_HOST=${_VITE_POSTHOG_HOST}
      - -f
      - Dockerfile
      - .
    dir: marketing

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:$BUILD_ID

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:$BUILD_ID
      - --region=${_RUN_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=256Mi
      - --max-instances=3

options:
  logging: CLOUD_LOGGING_ONLY
